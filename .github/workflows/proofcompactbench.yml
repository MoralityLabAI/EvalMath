name: ProofCompactBench exact gym
on:
  pull_request:
    paths:
      - 'gyms/ProofCompactBench/**'
      - '.github/workflows/proofcompactbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact oracles, native receipt controls, and CLI roundtrip
        shell: bash
        run: |
          set -euo pipefail
          cd gyms/ProofCompactBench
          node bench.mjs self-test
          node native.mjs self-test
          node bench.mjs build-public "$RUNNER_TEMP/pcb"
          python3 - "$RUNNER_TEMP/pcb" <<'PY'
          import json,sys,pathlib
          d=pathlib.Path(sys.argv[1])
          gold=[json.loads(x) for x in (d/'dev_test.gold.jsonl').read_text().splitlines()]
          packets=[json.loads(x) for x in (d/'dev_test.public.jsonl').read_text().splitlines()]
          assert len(gold)==len(packets)==96
          assert all('answer' not in p and 'optimum' not in p for p in packets)
          (d/'preds.jsonl').write_text(''.join(json.dumps({'id':r['id'],'answer':r['answer']})+'\n' for r in gold))
          PY
          node bench.mjs grade "$RUNNER_TEMP/pcb/dev_test.gold.jsonl" "$RUNNER_TEMP/pcb/preds.jsonl" "$RUNNER_TEMP/pcb/score.json"
          node bench.mjs export-train "$RUNNER_TEMP/pcb/train.gold.jsonl" "$RUNNER_TEMP/pcb/train-candidates.jsonl"
          if node bench.mjs export-train "$RUNNER_TEMP/pcb/dev_test.gold.jsonl" "$RUNNER_TEMP/bad.jsonl"; then exit 1; fi
          python3 - "$RUNNER_TEMP/pcb" <<'PY'
          import json,sys,pathlib
          d=pathlib.Path(sys.argv[1])
          s=json.loads((d/'score.json').read_text())
          assert s['total']==s['optimal']==96 and s['mean_score']==1
          assert len((d/'train-candidates.jsonl').read_text().splitlines())==384
          PY
