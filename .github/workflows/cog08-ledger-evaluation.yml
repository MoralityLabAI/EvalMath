name: COG08 independent ledger evaluation

on:
  push:
    paths:
      - 'src/spiral_ln/cogentic_ledger.py'
      - 'src/spiral_ln/evaluation_finite_sample.py'
      - 'scripts/verify_cogentic_ledger.py'
      - 'scripts/score_cogentic_ledger.py'
      - 'scripts/export_cogentic_lean.py'
      - 'scripts/check_receipts.py'
      - 'tests/test_cogentic_ledger.py'
      - 'tests/test_evaluation_finite_sample.py'
      - 'research/cogentic_suite/**'
      - 'output/cogentic_ledger/**'
      - 'pyproject.toml'
      - '.github/workflows/cog08-ledger-evaluation.yml'
  pull_request:
    paths:
      - 'src/spiral_ln/cogentic_ledger.py'
      - 'src/spiral_ln/evaluation_finite_sample.py'
      - 'scripts/verify_cogentic_ledger.py'
      - 'scripts/score_cogentic_ledger.py'
      - 'scripts/export_cogentic_lean.py'
      - 'scripts/check_receipts.py'
      - 'tests/test_cogentic_ledger.py'
      - 'tests/test_evaluation_finite_sample.py'
      - 'research/cogentic_suite/**'
      - 'output/cogentic_ledger/**'
      - 'pyproject.toml'
      - '.github/workflows/cog08-ledger-evaluation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  COG03_COMMIT: c1c903b3f0664ee19838fcba45bd67e24f779aab
  COG03_ROOT: upstream-cog03/research/cog03_ledger_router

jobs:
  receipts-and-score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test runner
        run: python -m pip install pytest==8.3.5
      - name: Exercise ledger accounting and paired inference
        run: python -m pytest -q tests/test_cogentic_ledger.py tests/test_evaluation_finite_sample.py
      - name: Regenerate registered receipt and check source hashes
        run: python scripts/check_receipts.py --only cogentic_ledger
      - name: Check out the pinned public COG03 artifacts
        uses: actions/checkout@v4
        with:
          repository: MoralityLabAI/LoopedTransformers
          ref: ${{ env.COG03_COMMIT }}
          path: upstream-cog03
          persist-credentials: false
          sparse-checkout: research/cog03_ledger_router
      - name: Verify upstream commit and restore frozen task bytes
        run: |
          test "$(git -C upstream-cog03 rev-parse HEAD)" = "$COG03_COMMIT"
          mkdir -p "$RUNNER_TEMP/cog08-inputs"
          gzip -dc "$COG03_ROOT/data/tasks.jsonl.gz" > "$RUNNER_TEMP/cog08-inputs/tasks.jsonl"
          cp "$COG03_ROOT/results/attempts.jsonl.gz" "$RUNNER_TEMP/cog08-inputs/attempts.jsonl.gz"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cog08-inputs'
          committed = json.loads(Path('output/cogentic_ledger/cog03_independent_replay.json').read_text())
          hashes = {}
          for name in ('tasks', 'attempts'):
              expected = committed['input_files'][name]
              path = root / expected['filename']
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              assert digest == expected['sha256'], f'{name}: upstream artifact hash differs'
              hashes[name] = {'filename': path.name, 'sha256': digest}
          provenance = {'repository': 'MoralityLabAI/LoopedTransformers',
                        'commit': os.environ['COG03_COMMIT'], 'input_files': hashes}
          (root / 'upstream.json').write_text(json.dumps(provenance, indent=2, sort_keys=True) + '\n')
          print(json.dumps(provenance, sort_keys=True))
          PY
      - name: Independently score every registered root and arm
        run: |
          python scripts/score_cogentic_ledger.py \
            --tasks "$RUNNER_TEMP/cog08-inputs/tasks.jsonl" \
            --attempts "$RUNNER_TEMP/cog08-inputs/attempts.jsonl.gz" \
            --protocol research/cogentic_suite/protocol.json \
            --compare looped:one_pass \
            --compare looped:reset_history \
            --compare looped:reset_inner \
            --compare looped:shuffled_history \
            --compare looped:random \
            --compare looped:ready_first \
            --compare looped:goal_ancestry \
            --output "$RUNNER_TEMP/cog08-independent-replay.json"
      - name: Reproduce the committed score and provenance
        run: |
          python - <<'PY'
          import json
          import os
          import runpy
          from pathlib import Path

          differences = runpy.run_path('scripts/check_receipts.py')['differences']
          committed = json.loads(Path('output/cogentic_ledger/cog03_independent_replay.json').read_text())
          fresh = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cog08-independent-replay.json').read_text())
          errors = differences(committed, fresh)
          assert not errors, '\n'.join(errors)
          assert fresh['registry_bound'] is True
          assert all(row['complete_trace_coverage'] and row['cost_accounting_complete']
                     for row in fresh['summary'])
          print(f"Reproduced {len(fresh['episodes'])} registered episodes, "
                f"{len(fresh['paired_comparisons'])} paired comparisons and all source/input hashes.")
          PY
      - name: Preserve pinned inputs for native proof replay
        uses: actions/upload-artifact@v4
        with:
          name: cog08-pinned-cog03-inputs
          path: ${{ runner.temp }}/cog08-inputs/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve independent score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog08-independent-score
          path: ${{ runner.temp }}/cog08-independent-replay.json
          if-no-files-found: warn
          retention-days: 30

  native-model-proofs:
    needs: receipts-and-score
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore hash-checked COG03 inputs
        uses: actions/download-artifact@v4
        with:
          name: cog08-pinned-cog03-inputs
          path: ${{ runner.temp }}/cog08-inputs/
      - name: Install Lean 4.35.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            -o "$RUNNER_TEMP/lean.tar.zst"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
      - name: Compile complete model proofs and reject the wrong-term sentinel
        run: |
          python scripts/export_cogentic_lean.py \
            --tasks "$RUNNER_TEMP/cog08-inputs/tasks.jsonl" \
            --attempts "$RUNNER_TEMP/cog08-inputs/attempts.jsonl.gz" \
            --arm looped --splits ordinary_test ood_test --seeds 17 29 --budget 24 \
            --lean "$RUNNER_TEMP/lean-4.35.0-linux/bin/lean" \
            --out "$RUNNER_TEMP/cog08-model-lean" --timeout 180
      - name: Reproduce deterministic certificates and complete run accounting
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          old_root = Path('output/cogentic_ledger/model_lean')
          committed = json.loads((old_root / 'receipt.json').read_text())
          fresh = json.loads((Path(os.environ['RUNNER_TEMP']) / 'cog08-model-lean/receipt.json').read_text())
          for name, record in committed['generated_files'].items():
              assert hashlib.sha256((old_root / name).read_bytes()).hexdigest() == record['sha256'], name
          for key in ('schema', 'passed', 'evidence', 'scope', 'selection', 'input_files',
                      'source_sha256', 'generated_files', 'counts', 'cohorts', 'cost_accounting'):
              assert fresh[key] == committed[key], f'Native replay differs: {key}'
          native = fresh['native_lean']
          assert 'version 4.35.0,' in native['version'], native['version']
          assert fresh['passed'] is True and native['positive_exit_code'] == 0
          assert native['all_axiom_lists_empty'] is True
          assert native['negative_wrong_term_rejected'] is True
          assert native['axiom_report_count'] == native['expected_theorems']
          print(json.dumps({'counts': fresh['counts'], 'native_lean': native}, sort_keys=True))
          PY
      - name: Preserve native proof sources, logs and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cog08-native-model-proofs
          path: ${{ runner.temp }}/cog08-model-lean/
          if-no-files-found: warn
          retention-days: 30
