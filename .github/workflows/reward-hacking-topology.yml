permissions:
  contents: read

jobs:
  exact-reward-topology:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact finite tests
        run: python -m pip install -e '.[test]'
      - name: Reward-topology and UGC constraint-world controls
        run: |
          python -m pytest -q tests/test_evaluation_reward_hacking_topology.py tests/test_evaluation_reward_path_gauge.py tests/test_evaluation_reward_hacking_guard.py tests/test_evaluation_reward_ugc_fixture.py tests/test_evaluation_reward_hacking_flow.py tests/test_evaluation_reward_hacking_multimap.py tests/test_evaluation_reward_hacking_audit_optimizer.py tests/test_evaluation_reward_hacking_adaptive_feedback.py tests/test_evaluation_reward_hacking_joint_audit.py tests/test_evaluation_reward_hacking_retry.py tests/test_evaluation_reward_hacking_retry_guard.py tests/test_evaluation_reward_hacking_stateful.py tests/test_evaluation_reward_hacking_stateful_guard.py tests/test_evaluation_reward_transition_closure.py tests/test_evaluation_reward_stochastic_closure.py tests/test_evaluation_reward_shared_kernel.py tests/test_evaluation_reward_kernel_switching.py tests/test_evaluation_reward_two_kernel.py tests/test_evaluation_reward_curved_kernel.py tests/test_evaluation_reward_quadratic_kernel.py tests/test_evaluation_reward_semialgebraic_kernel.py
      - name: Reproduce source-bound certificate
        run: python scripts/verify_reward_hacking_topology.py
