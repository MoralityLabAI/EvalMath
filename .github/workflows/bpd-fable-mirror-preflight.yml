name: Independent LoopedTransformers BPD Fable CPU source preflight

on:
  push:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-mirror-preflight.yml'
  pull_request:
    paths:
      - 'mechinterp/bpd/**'
      - '.github/workflows/bpd-fable-mirror-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bpd-cpu-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile all mirrored source modules
        run: python -m compileall -q mechinterp/bpd
      - name: Run scoped Fable regression tests, no model training
        run: python -m pytest -q mechinterp/bpd/tests/test_bpd_fable_preflight.py -vv
