name: Metamath reconstruction scorer
on:
  pull_request:
    paths:
      - 'gyms/MetamathReconstruction/**'
      - '.github/workflows/metamath-reconstruction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s gyms/MetamathReconstruction -p 'test_*.py' -v
