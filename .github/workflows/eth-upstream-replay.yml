name: Pinned upstream ETH Lean replay (independent)

on:
  push:
    branches:
      - gpt6/eth-upstream-kernel-replay-20261027
    paths:
      - .github/workflows/eth-upstream-replay.yml
      - scripts/replay_openai_eth_upstream.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eth-upstream-replay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upstream-comparator-and-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Independently fetch and replay pinned upstream
        run: bash scripts/replay_openai_eth_upstream.sh
      - name: Attach stage receipts and raw logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openai-eth-lean-replay-${{ github.run_id }}
          path: output/upstream_eth_replay/
          if-no-files-found: warn
          retention-days: 30
