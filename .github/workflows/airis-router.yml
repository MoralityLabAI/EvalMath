name: AIRIS recurrent router CPU
on:
  push:
    paths: ['gyms/AIRIS/router.py', 'gyms/AIRIS/router_data.py', 'gyms/AIRIS/test_router.py', 'gyms/AIRIS/ROUTER.md', 'gyms/AIRIS/partial.py', '.github/workflows/airis-router.yml']
  pull_request:
    paths: ['gyms/AIRIS/router.py', 'gyms/AIRIS/router_data.py', 'gyms/AIRIS/test_router.py', 'gyms/AIRIS/ROUTER.md', 'gyms/AIRIS/partial.py', '.github/workflows/airis-router.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s gyms/AIRIS -p test_router.py -v
      - run: python gyms/AIRIS/router.py --out airis-router-output
      - uses: actions/upload-artifact@v4
        with:
          name: AIRIS-06-router-pilot
          path: airis-router-output/
