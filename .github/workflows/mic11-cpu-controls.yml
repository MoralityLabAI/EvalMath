name: MIC-11 exact CPU controls
on:
  pull_request:
    paths:
      - 'gyms/MIC11/**'
      - '.github/workflows/mic11-cpu-controls.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mic11-exact-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU test dependencies
        run: |
          python -m pip install 'numpy==2.3.5' 'pytest==8.4.2'
          python -m pip install 'torch==2.9.1+cpu' --index-url https://download.pytorch.org/whl/cpu
      - name: Run the scoped engineering checks
        working-directory: gyms/MIC11
        run: python -m pytest -q test_mic11.py
