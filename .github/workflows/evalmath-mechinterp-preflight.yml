name: EvalMath mechanistic-resolution preflight safety
on:
  pull_request:
    paths:
      - 'skills/evalmath-mechinterp-power/**'
      - '.github/workflows/evalmath-mechinterp-preflight.yml'
  workflow_dispatch:
jobs:
  independent-root-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure-standard-library mechanistic resolution tests
        run: python -m unittest discover -s skills/evalmath-mechinterp-power/scripts -p 'test_*.py' -v
