name: AIRIS exact gym
on:
  push:
    paths: ['gyms/AIRIS/**', '.github/workflows/airis-evalmath.yml']
  pull_request:
    paths: ['gyms/AIRIS/**', '.github/workflows/airis-evalmath.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s gyms/AIRIS -v
      - name: Generate and compare deterministic receipts
        run: |
          python gyms/AIRIS/airis_gym.py > AIRIS-01.json
          python gyms/AIRIS/airis_gym.py > /tmp/AIRIS-01.json
          cmp AIRIS-01.json /tmp/AIRIS-01.json
      - uses: actions/upload-artifact@v4
        with:
          name: AIRIS-01-receipt
          path: AIRIS-01.json
