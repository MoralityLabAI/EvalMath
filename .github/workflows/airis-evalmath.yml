name: AIRIS exact gym
on:
  push:
    paths: ['gyms/AIRIS/**', '.github/workflows/airis-evalmath.yml']
  pull_request:
    paths: ['gyms/AIRIS/**', '.github/workflows/airis-evalmath.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s gyms/AIRIS -v
      - name: Generate and compare deterministic receipts
        run: |
          for entry in 'airis_gym AIRIS-01' 'temporal AIRIS-03'; do
            set -- $entry
            python gyms/AIRIS/$1.py > $2.json
            python gyms/AIRIS/$1.py > /tmp/$2.json
            cmp $2.json /tmp/$2.json
          done
          python -c 'import json; print(json.dumps(json.load(open("AIRIS-03.json"))["aggregates"], indent=2, sort_keys=True))'
      - uses: actions/upload-artifact@v4
        with:
          name: AIRIS-exact-receipts
          path: |
            AIRIS-01.json
            AIRIS-03.json
