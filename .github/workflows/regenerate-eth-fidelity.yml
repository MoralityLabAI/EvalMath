name: Regenerate ETH proof-fidelity receipt

on:
  push:
    branches:
      - research/openai-eth-proof-fidelity-20261027
    paths:
      - .github/workflows/regenerate-eth-fidelity.yml
      - src/spiral_ln/proof_fidelity.py
      - scripts/verify_proof_fidelity_openai_eth.py
      - configs/openai_eth_fidelity.json
      - paper/proof_fidelity_openai_eth.md
      - tests/test_proof_fidelity_openai_eth.py

permissions:
  contents: write

concurrency:
  group: eth-receipt-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/openai-eth-proof-fidelity-20261027
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project with test dependencies
        run: python -m pip install -e '.[test]'
      - name: Write receipt using the canonical verifier
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          PYTHONPATH=src python scripts/verify_proof_fidelity_openai_eth.py --output "$tmp/openai_eth_v0_2.json"
          mkdir -p output/proof_fidelity
          install -m 0644 "$tmp/openai_eth_v0_2.json" output/proof_fidelity/openai_eth_v0_2.json
          git rm -f --ignore-unmatch output/proof_fidelity/openai_eth_v0_1.json
          pytest -q tests/test_proof_fidelity_openai_eth.py
          python scripts/check_receipts.py --only openai_eth_fidelity
      - name: Commit only generated receipt
        run: |
          set -euo pipefail
          git add output/proof_fidelity/openai_eth_v0_2.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Regenerate ETH proof-fidelity receipt using verifier'
            git push origin HEAD:research/openai-eth-proof-fidelity-20261027
          fi
