name: VAD-13C calibrated timing

on:
  pull_request:
    paths:
      - 'scripts/verify_vad_batch_calibrated.py'
      - 'tests/test_vad_batch_calibrated.py'
      - 'scripts/verify_vad_batch.py'
      - 'scripts/vad_gym.py'
      - '.github/workflows/vad13c.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        lean: ['4.19.0', '4.35.0']
        family: ['F1', 'F2', 'F3', 'F4', 'F5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Source and accounting tests
        run: python -m pytest -q tests/test_vad_batch_calibrated.py
      - name: Install pinned Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v${{ matrix.lean }}
      - name: Calibrated physical timing
        run: |
          python scripts/verify_vad_batch_calibrated.py --out /tmp/vad13c --lean elan run leanprover/lean4:v${{ matrix.lean }} lean --families ${{ matrix.family }} --horizons 8 32 --repeats 3 --blocks 1
      - name: Upload timing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vad13c-${{ matrix.lean }}-${{ matrix.family }}
          path: /tmp/vad13c/receipt.json
          if-no-files-found: warn
