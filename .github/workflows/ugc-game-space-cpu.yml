name: UGCS-01 Game Space Finite Checks

on:
  push:
    paths:
      - 'src/spiral_ln/game_space_conjectures.py'
      - 'src/spiral_ln/game_space_partition.py'
      - 'src/spiral_ln/game_space_phase.py'
      - 'tests/test_game_space_conjectures.py'
      - 'tests/test_game_space_partition.py'
      - 'tests/test_game_space_phase.py'
      - 'scripts/scan_game_space_phase.py'
      - 'scripts/verify_game_space_conjectures.py'
      - 'paper/game_space_conjectures_2026_11.md'
      - 'paper/game_space_partition_bridge_2026_11.md'
      - 'output/game_space_conjectures/UGCS-01.json'
      - '.github/workflows/ugc-game-space-cpu.yml'
  pull_request:
    paths:
      - 'src/spiral_ln/game_space_conjectures.py'
      - 'src/spiral_ln/game_space_partition.py'
      - 'src/spiral_ln/game_space_phase.py'
      - 'tests/test_game_space_conjectures.py'
      - 'tests/test_game_space_partition.py'
      - 'tests/test_game_space_phase.py'
      - 'scripts/scan_game_space_phase.py'
      - 'scripts/verify_game_space_conjectures.py'
      - 'paper/game_space_conjectures_2026_11.md'
      - 'paper/game_space_partition_bridge_2026_11.md'
      - 'output/game_space_conjectures/UGCS-01.json'
      - '.github/workflows/ugc-game-space-cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_game_space_conjectures.py tests/test_game_space_partition.py tests/test_game_space_phase.py
      - name: Check deterministic source-fingerprinted receipt
        run: |
          python scripts/verify_game_space_conjectures.py > /tmp/UGCS-01.json
          cmp output/game_space_conjectures/UGCS-01.json /tmp/UGCS-01.json
