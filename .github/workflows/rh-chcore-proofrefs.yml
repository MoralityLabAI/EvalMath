name: RH ChCore deep compiled-reference probe

on:
  push:
    paths:
      - 'src/spiral_ln/rh_deep_analytic.py'
      - 'tests/test_rh_deep_analytic.py'
      - '.github/workflows/rh-chcore-proofrefs.yml'
  pull_request:
    paths:
      - 'src/spiral_ln/rh_deep_analytic.py'
      - 'tests/test_rh_deep_analytic.py'
      - '.github/workflows/rh-chcore-proofrefs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiled-chcore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: evalmath
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: leanprover-community/riemann-hypothesis
          ref: f150e02623b1e2bbe1f1da8eab5ffee5e930a6a3
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gym and test ChCore parser contracts
        working-directory: evalmath
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_rh_deep_analytic.py
      - name: Install Lean from the pinned upstream toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore official Mathlib cache
        working-directory: upstream
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: |
          lake exe mathlib/cache get
          df -h .
      - name: Probe original CharacterBalanceMoves.core and proposition_size_bound
        working-directory: evalmath
        run: |
          mkdir -p rh-chcore-proofrefs
          python -m spiral_ln.rh_deep_analytic \
            --source-root ../upstream \
            --targets balance_core size_bound \
            --max-modules 200 --max-depth 1 --max-nodes 120 \
            --output rh-chcore-proofrefs/proofref_graph.json \
            --summary rh-chcore-proofrefs/summary.json
      - name: Upload source-pinned compiled proof-reference receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rh-chcore-compiled-ref-graph
          path: evalmath/rh-chcore-proofrefs/
          if-no-files-found: ignore
