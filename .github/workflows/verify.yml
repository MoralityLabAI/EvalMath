name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded PR/feature-branch checks within the same event and ref.
# Keep default-branch, tag and manual runs independent (including slow receipts).
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{
    (github.event_name == 'pull_request' || (github.event_name == 'push' &&
    github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch))
    && 'latest' || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: pytest -q
      - name: Receipts (fast set; the two slow ones run under workflow_dispatch below)
        run: python scripts/check_receipts.py

  receipts-slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_receipts.py --only gold_calibration multigen

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Axioms
        run: |
          lake env lean axioms_check.lean > axioms.out 2>&1 || true
          python3 ../scripts/check_lean_axioms.py axioms.out axioms_check.lean
