name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded PR/feature-branch checks within the same event and ref.
# Keep default-branch, tag and manual runs independent (including slow receipts).
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{
    (github.event_name == 'pull_request' || (github.event_name == 'push' &&
    github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch))
    && 'latest' || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: pytest -q
      - name: Fetch pinned DCF-16 receipt inputs
        shell: bash
        run: |
          dir="$RUNNER_TEMP/dcf16_decision_curriculum"
          mkdir -p "$dir/data"
          source_url=https://raw.githubusercontent.com/MoralityLabAI/Compactification-Theory/db1cc6d67e8fa22c32927fcff8c3785e7b7a5c0c/research/dcf16_decision_curriculum
          curl --fail --silent --show-error --location --retry 3 --output "$dir/MANIFEST.json" "$source_url/MANIFEST.json"
          curl --fail --silent --show-error --location --retry 3 --output "$dir/data/heldout.jsonl.gz" "$source_url/data/heldout.jsonl.gz"
          printf '%s  %s\n' c128ee6896a5cb38b19cb4714d3c2dfde80c30afb12b29bdf24c7fa5933b84ac "$dir/data/heldout.jsonl.gz" | sha256sum --check
          echo "DCF16_DIR=$dir" >> "$GITHUB_ENV"
      - name: Receipts (fast set; the two slow ones run under workflow_dispatch below)
        run: python scripts/check_receipts.py

  receipts-slow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_receipts.py --only gold_calibration multigen

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib cache
        run: lake exe cache get
      - name: Build
        run: lake build
      - name: Axioms
        run: |
          lake env lean axioms_check.lean > axioms.out 2>&1 || true
          python3 ../scripts/check_lean_axioms.py axioms.out axioms_check.lean
      - name: VAD-05 isolated kernel replay
        run: lake env python3 ../scripts/verify_vad_lean.py --out /tmp/vad05_kernel --lean lean
      - name: Upload VAD-05 kernel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vad05-kernel-receipt
          path: |
            /tmp/vad05_kernel/receipt.json
            /tmp/vad05_kernel/kernel.json
            /tmp/vad05_kernel/manifest.json
          if-no-files-found: warn
      - name: VAD-06 Horn kernel replay
        run: lake env python3 ../scripts/verify_vad_horn.py --out /tmp/vad06_kernel --lean lean
      - name: Upload VAD-06 kernel receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vad06-kernel-receipt
          path: |
            /tmp/vad06_kernel/receipt.json
            /tmp/vad06_kernel/kernel.json
            /tmp/vad06_kernel/manifest.json
          if-no-files-found: warn
