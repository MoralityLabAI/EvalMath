name: EVAL-AUTH-01 exact finite authorization
on:
  push:
    paths:
      - 'src/spiral_ln/evaluation_authorization_quotient.py'
      - 'tests/test_evaluation_authorization_quotient.py'
      - 'scripts/verify_eval_auth01.py'
      - '.github/workflows/eval-auth01.yml'
  pull_request:
    paths:
      - 'src/spiral_ln/evaluation_authorization_quotient.py'
      - 'tests/test_evaluation_authorization_quotient.py'
      - 'scripts/verify_eval_auth01.py'
      - '.github/workflows/eval-auth01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Independent finite policy oracle
        run: python -m pytest -q tests/test_evaluation_authorization_quotient.py
      - name: Source-hashed exact receipt
        run: PYTHONPATH=src python scripts/verify_eval_auth01.py --output "${{ runner.temp }}/eval-auth01.json"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-auth01-receipt
          path: ${{ runner.temp }}/eval-auth01.json
