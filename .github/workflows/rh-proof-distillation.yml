name: RH proof distillation gym

on:
  push:
    paths:
      - 'src/spiral_ln/rh_distillation.py'
      - 'gyms/RHProofDistillation/**'
      - 'tests/test_rh_distillation.py'
      - '.github/workflows/rh-proof-distillation.yml'
  pull_request:
    paths:
      - 'src/spiral_ln/rh_distillation.py'
      - 'gyms/RHProofDistillation/**'
      - 'tests/test_rh_distillation.py'
      - '.github/workflows/rh-proof-distillation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m spiral_ln.rh_distillation preflight
      - run: python -m pytest -q tests/test_rh_distillation.py

  lean-proxy-gold:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch existing EvalMath Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Compile each gold proxy with Lean
        run: |
          python -m spiral_ln.rh_distillation grade \
            --submissions gyms/RHProofDistillation/gold.jsonl \
            --lean-cwd lean --timeout 90 --require-all \
            --output rh-gold-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rh-proof-distillation-gold-replay
          path: rh-gold-replay.json
          if-no-files-found: ignore
