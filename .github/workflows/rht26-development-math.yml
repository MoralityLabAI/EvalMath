name: RHT-26 development math / FSI-01 resolution review

on:
  pull_request:
    paths:
      - 'skills/evalmath-mechinterp-power/**'
      - 'src/spiral_ln/evaluation_reward_carryover_count.py'
      - 'tests/test_evaluation_reward_carryover_count.py'
      - 'paper/rht26_development_bridge.md'
      - 'TrainingParanoia/RHT-26/**'
      - 'scripts/verify_reward_carryover_count.py'
      - 'src/spiral_ln/evaluation_finite_kernels.py'
      - 'output/evaluation_reward_carryover_count/**'
      - '.github/workflows/rht26-development-math.yml'
  push:
    paths:
      - 'skills/evalmath-mechinterp-power/**'
      - 'src/spiral_ln/evaluation_reward_carryover_count.py'
      - 'tests/test_evaluation_reward_carryover_count.py'
      - 'paper/rht26_development_bridge.md'
      - 'TrainingParanoia/RHT-26/**'
      - 'scripts/verify_reward_carryover_count.py'
      - 'src/spiral_ln/evaluation_finite_kernels.py'
      - 'output/evaluation_reward_carryover_count/**'
      - '.github/workflows/rht26-development-math.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  math-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure-stdlib resolution and finite count-state tests
        run: |
          python -m unittest discover -s skills/evalmath-mechinterp-power/scripts -p 'test_*.py' -v
          PYTHONPATH=src python -m unittest tests.test_evaluation_reward_carryover_count -v
      - name: Syntax checks, separate from model training
        run: |
          python -m compileall -q skills/evalmath-mechinterp-power/scripts src/spiral_ln/evaluation_reward_carryover_count.py
      - name: Reproduce canonical RHT-26 and count-extension receipts
        run: python scripts/check_receipts.py --only reward_carryover reward_carryover_count
