name: PreferredEvals v2 integrity
on:
  push:
    paths:
      - 'PreferredEvals/**'
      - '.github/workflows/preferred-evals-v2.yml'
  pull_request:
    paths:
      - 'PreferredEvals/**'
      - '.github/workflows/preferred-evals-v2.yml'
  workflow_dispatch:
jobs:
  pure-stdlib:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog consistency and pilot planning gates
        run: |
          python PreferredEvals/v2/manifest.py --catalog PreferredEvals/v2/catalog.json --strict
          python PreferredEvals/v2/manifest.py --manifest PreferredEvals/v2/examples/development.json --strict
      - name: Native receipt and Prime v1 importer regressions
        run: python -m unittest discover -s PreferredEvals/v2/tests -p 'test_*.py' -v
      - name: FSI-01 manifest export (development evidence stays unsealed)
        run: |
          python PreferredEvals/v2/paired_receipts.py \
            --manifest PreferredEvals/v2/examples/development.json \
            --rows PreferredEvals/v2/examples/paired-development.json \
            --out "$RUNNER_TEMP/paired.json" --fsi-out "$RUNNER_TEMP/fsi.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/fsi.json")); assert len(d["cases"])==3; assert not d["sealed_readout"]; assert not d["clusters_independent"]'
          PYTHONPATH=src python -m spiral_ln.evaluation_finite_sample \
            --manifest "$RUNNER_TEMP/fsi.json" --output "$RUNNER_TEMP/fsi-result.json"
          python -c 'import json,os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/fsi-result.json")); assert d["verdict"] != "confirmed"; assert "readout_used_in_selection_or_unsealed" in d["gate_reasons"]; assert d["n_clusters"]==2'
      - name: PreferredEvals native rollout gym CPU and adapter smoke
        run: |
          python -m unittest discover -s PreferredEvals/gym/tests -p 'test_*.py' -v
          python PreferredEvals/gym/external.py --list
          python PreferredEvals/gym/external.py --profile prime-v041 --taskset gsm8k --model dummy-model --out "$RUNNER_TEMP/prime-smoke" --write-plan "$RUNNER_TEMP/prime-plan.json"
          python PreferredEvals/gym/external.py --profile inkling-deepswe --model dummy-model --out "$RUNNER_TEMP/inkling-smoke" --write-plan "$RUNNER_TEMP/inkling-plan.json"
          python -c 'import json,os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/prime-plan.json")); assert p["command"][0]=="vf-run"; assert not p["dry_run_only"] is False'
