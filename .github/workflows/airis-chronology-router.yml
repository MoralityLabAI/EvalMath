name: AIRIS chronology router CPU
on:
  push:
    paths: ['gyms/AIRIS/chronology*.py', 'gyms/AIRIS/test_chronology.py', 'gyms/AIRIS/CHRONOLOGY.md', 'gyms/AIRIS/nonstationary.py', 'gyms/AIRIS/curriculum.py', 'gyms/AIRIS/partial.py', '.github/workflows/airis-chronology-router.yml']
  pull_request:
    paths: ['gyms/AIRIS/chronology*.py', 'gyms/AIRIS/test_chronology.py', 'gyms/AIRIS/CHRONOLOGY.md', 'gyms/AIRIS/nonstationary.py', 'gyms/AIRIS/curriculum.py', 'gyms/AIRIS/partial.py', '.github/workflows/airis-chronology-router.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest discover -s gyms/AIRIS -p test_chronology.py -v
      - run: python gyms/AIRIS/chronology_router.py --out airis08
      - uses: actions/upload-artifact@v4
        with:
          name: AIRIS-08-chronology-router
          path: airis08/
