name: collatz-basin
on:
  pull_request:
    paths:
      - src/spiral_ln/evaluation_collatz_basin.py
      - tests/test_evaluation_collatz_basin.py
      - scripts/verify_collatz_basin.py
      - scripts/export_collatz_basin.py
      - fixtures/collatz_basin/**
      - output/collatz_basin/**
      - paper/collatz_basin_readout.md
      - configs/collatz_basin_pilot.json
      - .github/workflows/collatz-basin.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_evaluation_collatz_basin.py
      - run: python scripts/check_receipts.py --only collatz_basin
      - name: Reproduce pilot-only preflight
        shell: bash
        run: |
          set +e
          python skills/evalmath-mechinterp-power/scripts/preflight.py --pilot configs/collatz_basin_pilot.json --out /tmp/col-preflight.json --strict
          status=$?
          set -e
          test "$status" -eq 2
          python -c 'import json; a=json.load(open("/tmp/col-preflight.json")); b=json.load(open("output/collatz_basin/preflight.json")); assert a == b'
